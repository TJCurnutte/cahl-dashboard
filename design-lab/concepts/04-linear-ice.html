<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CAHL — Linear-Ice (CBJ)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090d; --srf:#0b0f16; --srf2:#0f1520; --line:#1c2637; --line2:#28374f;
  --text:#e9edf4; --mut:#7f8ca3; --faint:#54607a;
  --union:#002654; --goal:#ce1126; --silver:#a2aaad;
  --acc:#ce1126; /* Goal Red drives interactive states; Union Blue anchors surfaces */
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.mono{font-family:'IBM Plex Mono',monospace}

/* top bar */
.bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:0 16px;height:52px;border-bottom:1px solid var(--line);background:rgba(7,9,13,.9);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.1em}
.brand .flag{width:18px;height:12px;border-radius:2px;background:linear-gradient(180deg,var(--union) 0 33%,#fff 33% 66%,var(--goal) 66%)}
.kbtn{margin-left:auto;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;
  border:1px solid var(--line2);border-radius:8px;background:var(--srf);color:var(--mut);font-size:12.5px;transition:border-color .15s,color .15s}
.kbtn:hover{border-color:var(--silver);color:var(--text)}
.kbtn kbd{font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--srf2);border:1px solid var(--line2);
  border-radius:4px;padding:2px 5px;color:var(--faint)}

main{max-width:1080px;margin:0 auto;padding:22px 16px 90px}
.sec{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sec h2{font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--mut)}
.sec .r{flex:1;height:1px;background:var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line2);background:transparent;
  color:var(--mut);font-size:12px;font-weight:500;transition:all .15s}
.chip:hover{color:var(--text);border-color:var(--silver)}
.chip.on{background:var(--union);border-color:var(--union);color:#fff}
.chip.live-chip.on{background:var(--goal);border-color:var(--goal)}

/* game rows */
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--srf)}
.row{display:grid;grid-template-columns:64px 1fr auto 1fr 76px;align-items:center;gap:10px;
  padding:11px 14px;border-bottom:1px solid var(--line);transition:background .15s;cursor:default}
.row:last-child{border-bottom:0}
.row:hover{background:var(--srf2)}
.row .t{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mut)}
.row .t .st{display:block;font-size:9.5px;letter-spacing:.12em;margin-top:3px;color:var(--faint)}
.row .st.live{color:var(--goal)}
.row .st.fin{color:#3ecf8e}
.row .tm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .15s}
.row:hover .tm{transform:translateX(2px)}
.row .tm.right{text-align:right}
.row .mid{display:flex;align-items:center;gap:8px;justify-content:center}
.row .sc{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--faint)}
.row .sc.on{color:var(--text)}
.row .badge{font-size:9px;letter-spacing:.14em;font-weight:600;color:var(--goal);border:1px solid rgba(206,17,38,.4);
  border-radius:4px;padding:2px 6px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.row .badge{animation:none}}
.row .rk{font-size:11px;color:var(--faint);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.scrim{opacity:.55}
.row.scrim .tm{font-style:italic;font-weight:500;color:var(--mut)}

/* leaders */
.lead-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.lead{border:1px solid var(--line);border-radius:10px;background:var(--srf);padding:12px 14px;transition:border-color .15s}
.lead:hover{border-color:var(--line2)}
.lead .p{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;color:var(--silver)}
.lead .p em{font-style:normal;color:var(--goal);font-size:11px;vertical-align:top;margin-left:2px}
.lead .n{font-weight:600;font-size:13px;margin-top:2px}
.lead .tm{font-size:11px;color:var(--mut);margin-top:1px}

.empty{padding:18px;color:var(--mut);font-size:13px}

/* ===== command palette ===== */
.pal-ov{position:fixed;inset:0;z-index:100;background:rgba(4,6,10,.6);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 0}
.pal-ov.open{display:flex;animation:fin .12s ease}
@keyframes fin{from{opacity:0}to{opacity:1}}
.pal{width:min(620px,100%);background:var(--srf);border:1px solid var(--line2);border-radius:12px;
  overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .14s ease}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.pal-ov.open,.pal{animation:none}}
.pal input{width:100%;height:52px;padding:0 16px;background:transparent;border:0;outline:0;
  color:var(--text);font:inherit;font-size:15px;border-bottom:1px solid var(--line)}
.pal input::placeholder{color:var(--faint)}
.pal-list{max-height:46vh;overflow-y:auto;padding:6px}
.pal-grp{font-size:10px;letter-spacing:.16em;color:var(--faint);padding:10px 10px 4px}
.pal-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer}
.pal-item .ic{width:26px;height:26px;border-radius:6px;background:var(--union);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex:0 0 auto}
.pal-item .ic.g{background:var(--goal)}
.pal-item .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-item .sb{font-size:11.5px;color:var(--mut);margin-left:auto;white-space:nowrap}
.pal-item[aria-selected="true"]{background:var(--srf2);outline:1px solid var(--line2)}
.pal-item mark{background:none;color:var(--goal);font-weight:700}
.pal-foot{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--faint)}
.pal-foot kbd{font-family:'IBM Plex Mono',monospace;border:1px solid var(--line2);border-radius:3px;padding:1px 4px;margin-right:3px}

@media(max-width:640px){
  .row{grid-template-columns:52px 1fr auto;gap:8px;padding:10px 10px}
  .row .tm.right{display:none}
  .row .rk{display:none}
  .kbtn span.ktxt{display:none}
}
</style>
</head>
<body>

<header class="bar">
  <span class="brand"><span class="flag"></span>CAHL</span>
  <button class="kbtn" id="kbtn" aria-label="Open command palette">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <span class="ktxt">Search players, teams…</span>
    <kbd>⌘K</kbd>
  </button>
</header>

<main>
  <div class="sec"><h2>TONIGHT</h2><div class="r"></div>
    <div class="chips" id="filters">
      <button class="chip live-chip" data-f="live">Live</button>
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="north">North</button>
      <button class="chip" data-f="easton">Easton</button>
      <button class="chip" data-f="dublin">Dublin</button>
      <button class="chip" data-f="other">Other rinks</button>
    </div>
  </div>
  <div class="rows" id="games"></div>

  <div class="sec"><h2>TONIGHT'S POINTS LEADERS</h2><div class="r"></div></div>
  <div class="lead-grid" id="leaders"></div>
</main>

<div class="pal-ov" id="ov">
  <div class="pal" role="dialog" aria-label="Command palette">
    <input id="q" type="text" placeholder="Search players and teams…" autocomplete="off" spellcheck="false">
    <div class="pal-list" id="plist"></div>
    <div class="pal-foot"><span><kbd>↑↓</kbd>navigate</span><span><kbd>↵</kbd>open</span><span><kbd>esc</kbd>close</span></div>
  </div>
</div>

<script>
/* ---- real slate (Thu) + fresh leaders, from cahl.neural-forge.io ---- */
const GAMES=[
 {t:"8:30 PM",h:"Dead Batteries",a:"Purple Koolaid",r:"Easton"},
 {t:"9:00 PM",h:"Elmwood Iron Bucs",a:"Ruckmoor Cannons",r:"North"},
 {t:"9:30 PM",h:"Goal Miners (Thursday)",a:"Hawaii 5-Hole (Thu)",r:"Dublin"},
 {t:"9:30 PM",h:"Nomads",a:"White Lightning",r:"Ice Works"},
 {t:"9:30 PM",h:"Chili Dogs",a:"Wampas",r:"North"},
 {t:"9:40 PM",h:"Huge Dekes",a:"Rangers",r:"NTPRD"},
 {t:"9:40 PM",h:"Ice Hogs",a:"The Chirps (Thurs)",r:"Easton"},
 {t:"9:40 PM",h:"The Thursday Knights",a:"Rickety Crickets I",r:"North"},
 {t:"9:40 PM",h:"Beerzerkers",a:"Nite Caps",r:"Ice Haus"},
 {t:"9:50 PM",h:"36 Minutes Till Bua",a:"Shenanigans",r:"Easton"},
 {t:"10:10 PM",h:"Bye Week",a:"Brew Jackets",r:"Dublin"},
 {t:"10:10 PM",h:"Rink Rats",a:"Flyin Dinocorns (Thurs)",r:"North"},
 {t:"10:40 PM",h:"Beer",a:"Dummies",r:"Dublin"},
 {t:"10:40 PM",h:"Brian's Bail Bonds",a:"Jetstream Jets",r:"Ice Works"},
 {t:"10:40 PM",h:"The Freeze",a:"Spare Parts",r:"North"},
 {t:"10:50 PM",h:"Springfield Fire",a:"Ohio Warriors",r:"NTPRD"},
 {t:"10:50 PM",h:"Original 6 Packs",a:"Nat 1 Club",r:"North"},
 {t:"10:50 PM",h:"Mr. Mulch",a:"Cashouts",r:"Ice Haus",live:[3,2]},
 {t:"10:50 PM",h:"District 5",a:"Stingers",r:"Easton",live:[1,4]},
 {t:"9:45 AM",h:"Team Blue",a:"Team Red",r:"North",scrim:1},
];
const LEADERS=[
 {n:"William Vonderahe",tm:"Black and Tan",p:5},
 {n:"Kurt Grove",tm:"The Beer Barrel Boys",p:4},
 {n:"Andres Morales",tm:"Parking Lot Beers",p:4},
 {n:"Dante Moretti",tm:"Busch League",p:4},
 {n:"Raymond Parker",tm:"The Beer Barrel Boys",p:4},
 {n:"Travis Curnutte",tm:"Swamp Donkeys",p:2},
];
const PLAYERS=[
 ["Travis Curnutte","Swamp Donkeys","D"],["William Vonderahe","Black and Tan","C"],
 ["Kurt Grove","The Beer Barrel Boys","LW"],["Andres Morales","Parking Lot Beers","C"],["Dante Moretti","Busch League","RW"],
 ["Raymond Parker","The Beer Barrel Boys","D"],["Travis Corson","Rickety Crickets I","D"],
 ["Cole Johnson","Barons","RW"],["Dean Blaisdell","Wampas","G"],["Sully McBrayer","Chili Dogs","C"],
 ["Petey Kowalczyk","Nomads","LW"],["Gus Halvorsen","White Lightning","D"],
 ["Rick Thibodeaux","Goal Miners (Thursday)","G"],["Marty Deluca","Hawaii 5-Hole (Thu)","C"],
 ["Owen Przybylski","Huge Dekes","RW"],["Nate Carbone","Rangers","D"],
 ["Fitz Malloy","Ice Hogs","C"],["Cormac Walsh","The Chirps (Thurs)","LW"],
 ["Big Tom Zawadzki","The Thursday Knights","D"],["Jessie Mangrum","Rickety Crickets I","C"],
 ["Hollis Bunker","Beerzerkers","RW"],["Denny Kravitz","Nite Caps","G"],
 ["Louie Fanelli","36 Minutes Till Bua","C"],["Sasha Petrenko","Shenanigans","LW"],
 ["Marv Tollerud","Bye Week","D"],["Chase Bundrick","Brew Jackets","RW"],
 ["Elliot Vance","Rink Rats","C"],["Priya Raman","Flyin Dinocorns (Thurs)","D"],
 ["Buck Compton","Beer","LW"],["Cletus Nagy","Dummies","RW"],
 ["Rico Saunders","Brian's Bail Bonds","C"],["Jett Kowalski","Jetstream Jets","D"],
 ["Nils Bergstrom","The Freeze","G"],["Walt Ptaszynski","Spare Parts","D"],
 ["Mickey Redmond Jr","Springfield Fire","C"],["Chief Wannamaker","Ohio Warriors","RW"],
 ["Gordie Steen","Original 6 Packs","LW"],["Nat Flanders","Nat 1 Club","C"],
 ["Emile Bouchard","Mr. Mulch","D"],["Tess Callahan","Cashouts","RW"],
 ["Gordon Bombay","District 5","C"],["Adam Banks","Stingers","RW"],
].map(p=>({n:p[0],t:p[1],pos:p[2]}));

let filter="all";
function state(g){
  if(g.scrim) return g.t.includes("AM")?"fin":"up";
  const m=(g.t||"").match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i); if(!m) return "up";
  let hh=+m[1]%12; if(m[3].toUpperCase()==="PM")hh+=12;
  const start=new Date(); start.setHours(hh,+m[2],0,0);
  const mins=(Date.now()-start)/6e4;
  if(mins<-10) return "up";
  if(mins>=100) return "fin";
  if(g.live&&mins>=85) return "fin";
  return "live";
}
function renderGames(){
  const el=document.getElementById("games");
  const list=GAMES.filter(g=>{
    if(filter==="all")return true;
    if(filter==="live")return state(g)==="live";
    if(filter==="other")return!["North","Easton","Dublin"].includes(g.r);
    return g.r===filter;
  });
  el.innerHTML=list.map(g=>{
    const st=state(g);
    const stl=st==="live"?'<span class="st live">● LIVE</span>':st==="fin"?'<span class="st fin">FINAL</span>':'<span class="st">UPCOMING</span>';
    const hs=st==="live"&&g.live?`<span class="sc on">${g.live[0]}</span>`:st==="fin"?'<span class="sc">F</span>':'<span class="sc">–</span>';
    const as_=st==="live"&&g.live?`<span class="sc on">${g.live[1]}</span>`:st==="fin"?'<span class="sc">F</span>':'<span class="sc">–</span>';
    const badge=st==="live"?'<span class="badge">3RD</span>':"";
    return `<div class="row${g.scrim?' scrim':''}">
      <div class="t">${g.t}${stl}</div>
      <div class="tm">${g.h}</div>
      <div class="mid">${hs}<span class="sc" style="color:var(--line2)">@</span>${as_}${badge}</div>
      <div class="tm right">${g.a}</div>
      <div class="rk">${g.r}</div>
    </div>`;
  }).join("")||'<div class="empty">No games match this filter.</div>';
}
function renderLeaders(){
  document.getElementById("leaders").innerHTML=LEADERS.map(l=>`
    <div class="lead"><div class="p">${l.p}<em>PTS</em></div><div class="n">${l.n}</div><div class="tm">${l.tm}</div></div>`).join("");
}

/* ---- ⌘K palette ---- */
const ov=document.getElementById("ov"),q=document.getElementById("q"),plist=document.getElementById("plist");
let items=[],sel=0;
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function hi(s,query){
  if(!query)return esc(s);
  const i=s.toLowerCase().indexOf(query.toLowerCase());
  if(i<0)return esc(s);
  return esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+query.length))+"</mark>"+esc(s.slice(i+query.length));
}
function fuzzy(item,query){
  const n=item.n.toLowerCase(),t=(item.t||"").toLowerCase(),qq=query.toLowerCase();
  return n.includes(qq)||t.includes(qq);
}
function openPal(){ov.classList.add("open");q.value="";run("");setTimeout(()=>q.focus(),20)}
function closePal(){ov.classList.remove("open")}
function run(query){
  const qq=query.trim();
  const players=PLAYERS.filter(p=>fuzzy(p,qq)).slice(0,8).map(p=>({kind:"p",...p}));
  const teams=[...new Set(PLAYERS.map(p=>p.t))].filter(t=>t.toLowerCase().includes(qq.toLowerCase())).slice(0,4).map(t=>({kind:"t",n:t}));
  const games=qq?GAMES.filter(g=>g.h.toLowerCase().includes(qq.toLowerCase())||g.a.toLowerCase().includes(qq.toLowerCase())).slice(0,4).map(g=>({kind:"g",...g})):[];
  items=[...players,...teams,...games];sel=0;
  if(!items.length){plist.innerHTML='<div class="empty">No matches.</div>';return}
  let html="",last="";
  items.forEach((it,i)=>{
    const grp=it.kind==="p"?"PLAYERS":it.kind==="t"?"TEAMS":"TONIGHT'S GAMES";
    if(grp!==last){html+=`<div class="pal-grp">${grp}</div>`;last=grp}
    if(it.kind==="p")html+=`<div class="pal-item" data-i="${i}" role="option" aria-selected="${i===0}">
      <span class="ic">${esc(it.pos||"")}</span><span class="nm">${hi(it.n,qq)}</span><span class="sb">${esc(it.t)}</span></div>`;
    else if(it.kind==="t")html+=`<div class="pal-item" data-i="${i}" role="option" aria-selected="${i===0}">
      <span class="ic">≡</span><span class="nm">${hi(it.n,qq)}</span><span class="sb">team page</span></div>`;
    else html+=`<div class="pal-item" data-i="${i}" role="option" aria-selected="${i===0}">
      <span class="ic g">🏒</span><span class="nm">${hi(it.h+" vs "+it.a,qq)}</span><span class="sb">${esc(it.t)} · ${esc(it.r)}</span></div>`;
  });
  plist.innerHTML=html;
  [...plist.querySelectorAll(".pal-item")].forEach(el=>{
    el.onmouseenter=()=>{sel=+el.dataset.i;paint()};
    el.onclick=()=>closePal();
  });
}
function paint(){[...plist.querySelectorAll(".pal-item")].forEach(el=>el.setAttribute("aria-selected",+el.dataset.i===sel))}
q.addEventListener("input",()=>run(q.value));
q.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){sel=Math.min(sel+1,items.length-1);paint();e.preventDefault()}
  else if(e.key==="ArrowUp"){sel=Math.max(sel-1,0);paint();e.preventDefault()}
  else if(e.key==="Enter"){closePal()}
  else if(e.key==="Escape"){closePal()}
});
document.getElementById("kbtn").addEventListener("click",openPal);
ov.addEventListener("click",e=>{if(e.target===ov)closePal()});
addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();ov.classList.contains("open")?closePal():openPal()}
  else if(e.key==="Escape")closePal();
});
document.getElementById("filters").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  document.querySelectorAll("#filters .chip").forEach(c=>c.classList.toggle("on",c===b));
  filter=b.dataset.f;renderGames();
});
renderGames();renderLeaders();
</script>
</body>
</html>
