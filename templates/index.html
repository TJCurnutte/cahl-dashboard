<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="CAHL Dashboard — live scores, league standings, team and player stats, and analytics for beer-league hockey." />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CAHL" />
  <title>CAHL Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/static/css/style.css?v=7" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div id="app">
    <header role="banner">
      <h1>
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 4.5l4.8 4.8a4 4 0 0 0 2.83 1.17H14l7 7.5" />
          <path d="M14 21h5.5" />
          <circle cx="6.5" cy="18.5" r="2.5" />
        </svg>
        <span class="brand-text">CAHL<span class="brand-accent"> Dashboard</span></span>
      </h1>
      <div class="controls">
        <button id="refreshBtn" class="ghost small" title="Refresh latest scores and stats">Refresh</button>
        <label class="switch" title="Toggle live auto-refresh">
          <input type="checkbox" id="autoToggle" aria-label="Toggle live auto-refresh" />
          <span class="toggle"></span>
          <span>Live</span>
        </label>
      </div>
    </header>

    <main id="main" role="main" aria-live="polite" tabindex="-1"></main>

    <nav role="navigation" aria-label="Primary">
      <a href="#" class="nav-link active" data-tab="today" aria-label="Today's games" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Today
      </a>
      <a href="#" class="nav-link" data-tab="league" aria-label="League standings">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/><line x1="6" y1="4" x2="18" y2="4"/></svg>
        League
      </a>
      <a href="#" class="nav-link" data-tab="team" aria-label="Team stats">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Team
      </a>
      <a href="#" class="nav-link" data-tab="players" aria-label="Player stats">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        Players
      </a>
      <a href="#" class="nav-link" data-tab="analytics" aria-label="Analytics">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Analytics
      </a>
    </nav>
  </div>

  <script src="/static/js/app.js?v=7"></script>
</body>
</html>
